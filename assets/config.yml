# Homepage configuration
# See https://fontawesome.com/search for icons options
# Optional: Use external configuration file.
# Using this will ignore remaining config in this file
# externalConfig: https://example.com/server-luci/config.yaml
title: "Mainframe"
subtitle: "triclick.lan"
# documentTitle: "Welcome" # Customize the browser tab text
logo: "/assets/images/triclick-logo.png"
# Alternatively a fa icon can be provided:
# icon: "fas fa-skull-crossbones"

header: true # Set to false to hide the header
# Optional: Different hotkey for search, defaults to "/"
# hotkey:
#   search: "Shift"
footer: '<p>powered by <a href="https://triclick.co/">@triclick.co</a></p>' # set false if you want to hide it.
columns: "4" # "auto" or number (must be a factor of 12: 1, 2, 3, 4, 6, 12)
connectivityCheck: true # whether you want to display a message when the apps are not accessible anymore (VPN disconnected for example).
# You should set it to true when using an authentication proxy, it also reloads the page when a redirection is detected when checking connectivity.

# Set the default layout and color scheme
defaults:
  layout: list # Either 'columns', or 'list'
  colorTheme: auto # One of 'auto', 'light', or 'dark'
# Optional theming
theme: default # 'default' or one of the themes available in 'src/assets/themes'.
# Optional custom stylesheet
# Will load custom CSS files. Especially useful for custom icon sets.
stylesheet:
  - "assets/custom.css"
# Here is the exhaustive list of customization parameters
# However all value are optional and will fallback to default if not set.
# if you want to change only some of the colors, feel free to remove all unused key.
colors:
  light:
    highlight-primary: "#1bc7ed"
    highlight-secondary: "#1bc7ed"
    highlight-hover: "#0094ff"
    background: "#f5f5f5"
    card-background: "#ffffff"
    text: "#363636"
    text-header: "#424242"
    text-title: "#303030"
    text-subtitle: "#424242"
    card-shadow: rgba(0, 0, 0, 0.1)
    link: "#1bc7ed"
    link-hover: "#ffb000"
    background-image: "/assets/images/light-bg.png" # prefix with your sub subpath if any (ex: /homer/assets/...)

  dark:
    highlight-primary: "#1bc7ed"
    highlight-secondary: "#1bc7ed"
    highlight-hover: "#0094ff"
    background: "#050537"
    card-background: "#222222"
    text: "#eaeaea"
    text-header: "#ffffff"
    text-title: "#fafafa"
    text-subtitle: "#f5f5f5"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#1bc7ed"
    link-hover: "#ffb000"
    background-image: "/assets/images/dark-bg.png" # prefix with your sub subpath if any (ex: /homer/assets/...)
# Optional navbar
# links: [] # Allows for navbar (dark mode, layout, and search) without any links
links:
  - name: "Website"
    icon: "fa fa-globe-americas"
    url: "https://triclick.co"

  - name: "Portafolio"
    icon: "fas fa-briefcase"
    url: "https://triclick.co/portafolio"

  - name: "Webmail"
    icon: "fas fa-envelope"
    url: "https://triclick.co:2096"

  - name: "cPanel"
    icon: "fab fa-cpanel"
    subtitle: "Panel de Control del Sitio Web" # optional, if no subtitle is defined, PiHole statistics will be shown
    tag: "web"
    keywords: "panel sysadmin"
    url: "https://triclick.co:2083"

  - name: "@rolodoom"
    icon: "fab fa-github"
    tag: "code"
    keywords: "git code"
    url: "https://github.com/rolodoom/"

  - name: "Localhost [DEV]"
    icon: "fa-solid fa-terminal"
    tag: "server"
    keywords: "desarrollo"
    url: "http://localhost/"

